# Tests Miri can't run, by reason. Every other test, including new ones, runs under Miri and must pass.
#
# - 11: system calls, sockets or kernel files Miri does not model
# - 18: OpenSSL (crypto and TLS)
# - 5: SQLite, and a parking_lot_core futex call Miri rejects
# - 10: too slow under Miri
# - 4: depends on real time
# - 32: C compression libraries
[profile.default-miri]
default-filter = """
not (
    test(=backend::http_proxy::tests::test_head_and_get)
    | test(=blob_cache::tests::test_meta_blob)
