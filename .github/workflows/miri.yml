name: Miri Test

on:
  push:
    branches: ["**", "stable/**"]
    paths-ignore: [ '**.md', '**.png', '**.jpg', '**.svg', '**/docs/**' ]
  pull_request:
    branches: ["**", "stable/**"]
    paths-ignore: [ '**.md', '**.png', '**.jpg', '**.svg', '**/docs/**' ]
  schedule:
    # Run daily sanity check at 03:00 clock UTC
    - cron: "0 03 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  nydus-unit-test-with-miri:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: Linux-cargo-amd64
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - name: Install cargo nextest
      uses: taiki-e/install-action@nextest
    - name: Fscache Setup
      run: sudo bash misc/fscache/setup.sh
    - name: Install Miri
      run: |
        rustup toolchain install nightly --component miri
        rustup override set nightly
        cargo miri setup
    - name: Unit Test with Miri
      run: |
        # `tee` swallowed miri's exit status, and `grep 'Undefined Behavior'` succeeded when it
        # found UB, so the step didn't reflect the test run (same fix as upstream #2200).
        set -o pipefail
        RUSTUP_BIN=$(which rustup)
        # The tests need root. Pass the toolchain environment explicitly: the runner's sudo
        # rejects `-E`, and without it root finds neither the nightly toolchain nor nextest.
        sudo env "PATH=${PATH}" "HOME=${HOME}" \
          "RUSTUP_HOME=${RUSTUP_HOME:-${HOME}/.rustup}" "CARGO_HOME=${CARGO_HOME:-${HOME}/.cargo}" \
          "RUSTUP=${RUSTUP_BIN}" make miri-ut-nextest 2>&1 | tee miri-ut.log
        if grep -q 'error: Undefined Behavior' miri-ut.log; then
          echo "::error::Miri reported undefined behavior; see the log above."
          exit 1
        fi
